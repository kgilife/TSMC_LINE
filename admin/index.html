<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGM 業務推廣連結後端管理面板</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    document.write('<link rel="stylesheet" href="../css/style.css?v=' + new Date().getTime() + '">');
  </script>
</head>
<body>

  <div class="glow-bg">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
  </div>

  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-share-nodes"></i></div>
        <div class="brand-text">
          <h1>MGM 系統管理</h1>
          <span>推廣連結生成後台</span>
        </div>
      </div>
      
      <nav class="nav-menu">
        <a href="../stats/index.html" class="nav-link"><i class="fa-solid fa-chart-simple"></i> 前往統計看板 &rarr;</a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="action-btn" title="切換深淺色模式">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="app-content">
    
    <div id="setup-banner" class="card glass-card setup-banner hidden" style="border-color: #eab308; background: rgba(234,179,8,0.05); padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="font-size: 28px; color: #eab308;"><i class="fa-solid fa-circle-exclamation"></i></div>
        <div>
          <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">⚠️ 尚未設定 Google 試算表 API</h4>
          <p style="font-size: 13px; color: var(--text-secondary);">請先設定 config.js。</p>
        </div>
      </div>
    </div>

    <!-- SECTION 1: URL Management -->
    <section id="url-management-section" class="content-section">
      <div class="card glass-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-list-check"></i>
            <h2>目標推廣網址管理</h2>
          </div>
          <p class="card-subtitle">設定您的推廣目標網址清單</p>
        </div>
        <div class="card-body">
          <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
            <input type="text" id="new-url-id" placeholder="網址編號 (例: 1)" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
            <input type="text" id="new-target-url" placeholder="實際目標網址 (例: https://...)" style="flex: 3; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
            <button id="add-url-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> 新增網址</button>
          </div>
          <div class="scrollable-table">
            <table class="app-table" id="urls-table">
              <thead>
                <tr>
                  <th width="150">網址編號</th>
                  <th>目標網址</th>
                  <th width="100">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-row"><td colspan="3" class="text-center">讀取中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: Batch Generator -->
    <section id="generator-section" class="content-section">
      <div class="card glass-card generator-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <h2>批量生成推廣連結</h2>
          </div>
          <p class="card-subtitle">請從 Excel 複製三欄 (網址編號、使用者代碼、姓名) 並貼上至下方</p>
        </div>
        
        <div class="card-body">
          <div class="form-group">
            <textarea id="batch-input" rows="8" placeholder="請貼上表格資料...&#10;1&#9;A001&#9;王小明&#10;2&#9;B002&#9;李大華" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); resize: vertical;"></textarea>
          </div>
          <button id="batch-generate-btn" class="btn btn-block btn-gradient">
            <span class="btn-text">開始批量生成</span>
            <i class="fa-solid fa-arrow-right-long"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- SECTION 3: Generated Links Management -->
    <section id="links-management-section" class="content-section">
      <div class="card glass-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-link"></i>
            <h2>已生成的推廣連結管理</h2>
          </div>
          <p class="card-subtitle">檢視與刪除已經生成的業務員專屬連結</p>
        </div>
        <div class="card-body">
          <div class="scrollable-table" style="max-height: 400px;">
            <table class="app-table" id="links-table">
              <thead>
                <tr>
                  <th width="130">使用者代碼</th>
                  <th width="100">網址編號</th>
                  <th>短網址</th>
                  <th width="130">姓名</th>
                  <th width="100">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr class="empty-row"><td colspan="5" class="text-center">讀取中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
